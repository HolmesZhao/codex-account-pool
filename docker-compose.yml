services:
  codex-account-pool:
    build:
      context: .
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.155.0-alpha.9.2}
    image: codex-account-pool:local
    init: true
    restart: unless-stopped
    read_only: true
    ports:
      - "${CODEX_POOL_BIND_IP:-127.0.0.1}:${CODEX_POOL_PORT:-4317}:4317"
    environment:
      CODEX_POOL_HOST: 0.0.0.0
      CODEX_POOL_PORT: 4317
      CODEX_POOL_DATABASE_URL: /data/codex-pool.sqlite
      CODEX_POOL_AUTH_DATABASE_URL: /data/codex-pool-auth.sqlite
      CODEX_POOL_SESSION_SECRET: ${CODEX_POOL_SESSION_SECRET:?set CODEX_POOL_SESSION_SECRET in .env}
      CODEX_POOL_CREDENTIAL_KEY: ${CODEX_POOL_CREDENTIAL_KEY:?set CODEX_POOL_CREDENTIAL_KEY in .env}
      CODEX_POOL_ADMIN_USERNAME: ${CODEX_POOL_ADMIN_USERNAME:-admin}
      CODEX_POOL_ADMIN_PASSWORD: ${CODEX_POOL_ADMIN_PASSWORD:?set CODEX_POOL_ADMIN_PASSWORD in .env}
      CODEX_POOL_MAINTENANCE_DISABLED: ${CODEX_POOL_MAINTENANCE_DISABLED:-1}
    volumes:
      - codex-pool-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  codex-pool-data:
